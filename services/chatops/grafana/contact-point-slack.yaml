# Grafana Unified Alerting Contact Point & Notification Policy for Homelab Slack Alerts
# Target: promstack-grafana (monitoring namespace)
apiVersion: 1

contactPoints:
  - orgId: 1
    name: slack-homelab-alerts
    receivers:
      - uid: slack_homelab_alerts_cp
        type: slack
        settings:
          url: "${SLACK_WEBHOOK_URL}"
          recipient: "#homelab-alerts"
          token: "${SLACK_BOT_TOKEN}"
          username: "Grafana Homelab Alerting"
          icon_emoji: ":rotating_light:"
          title: |
            [{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}
          text: |
            {{ range .Alerts -}}
            *Alert:* {{ .Annotations.summary }}
            *Description:* {{ .Annotations.description }}
            *Namespace:* {{ if .Labels.namespace }}{{ .Labels.namespace }}{{ else }}N/A{{ end }}{{ if .Labels.pod }} | *Pod:* {{ .Labels.pod }}{{ else if .Labels.container }} | *Container:* {{ .Labels.container }}{{ else if .Labels.app }} | *App:* {{ .Labels.app }}{{ end }} | *Severity:* {{ if .Labels.severity }}{{ .Labels.severity }}{{ else }}info{{ end }}
            {{ end -}}
        disableResolveMessage: false

policies:
  - orgId: 1
    receiver: slack-homelab-alerts
    group_by:
      - grafana_folder
      - alertname
      - namespace
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
    routes:
      - receiver: slack-homelab-alerts
        object_matchers:
          - ["namespace", "=~", "media|monitoring|infrastructure|utilities|networking|default"]
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 4h
