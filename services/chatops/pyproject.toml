[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "homelab-chatops"
version = "0.1.0"
description = "Zero-Trust Slack Socket Mode ChatOps Gateway & Antigravity FastMCP Server for Homelab"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "slack-bolt>=1.20.0",
    "aiohttp>=3.9.0",
    "mcp[cli]>=1.2.0",
]

[project.optional-dependencies]
agent = [
    "google-antigravity>=0.1.0",
]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
homelab-chatops-gateway = "services.chatops.gateway.app:main"
homelab-chatops-mcp = "services.chatops.mcp.server:main"
