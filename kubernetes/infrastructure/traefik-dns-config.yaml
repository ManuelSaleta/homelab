apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    # 1. Cloudflare API Token
    env:
      - name: CLOUDFLARE_DNS_API_TOKEN
        valueFrom:
          secretKeyRef:
            name: cloudflare-dns-api-token
            key: CF_API_TOKEN

    # 2. ACME DNS-01 Challenge Configuration
    certificatesResolvers:
      le-resolver:
        acme:
          email: "manny2206@gmail.com"
          storage: /data/acme.json
          dnsChallenge:
            provider: cloudflare
            resolvers:
              - "1.1.1.1:53"
              - "8.8.8.8:53"

    # 3. Default TLS and Cert Resolver on websecure via Helm values
    ports:
      websecure:
        tls:
          enabled: true
          certResolver: le-resolver

    # 4. Storage Persistence
    persistence:
      enabled: true
      path: /data
      mountPath: /data
      size: 128Mi
