          "pluginVersion": "v11.4.0",
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum(kube_pod_container_status_running{namespace=~\"$namespace\", container=~\"nordlynx|prowlarr|qbittorrent|vpn-media-sync\"}) OR on() vector(0)",
