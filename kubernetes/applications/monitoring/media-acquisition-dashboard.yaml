apiVersion: v1
kind: ConfigMap
metadata:
  name: homelab-media-acquisition-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
    app: kube-prometheus-stack-grafana
    app.kubernetes.io/instance: promstack
    app.kubernetes.io/part-of: kube-prometheus-stack
data:
