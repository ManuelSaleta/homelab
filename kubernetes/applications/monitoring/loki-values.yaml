deploymentMode: SingleBinary

# Disable all components that are currently creating "Ghost" pods
memcached:
  enabled: false
chunksCache:
  enabled: false
resultsCache:
  enabled: false

# Keep the gateway enabled
gateway:
  enabled: true
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: DoesNotExist

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: 2024-04-01
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h

# This chart handles Single Binary mode by default if you don't define extra components
singleBinary:
  replicas: 1
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: DoesNotExist
  persistence:
    enabled: true
    size: 10Gi

# We disable the scalable components explicitly here
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0
