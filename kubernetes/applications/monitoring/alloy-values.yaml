# alloy-values.yaml
alloy:
  configMap:
    content: |
      // 1. Discover the pods
      discovery.kubernetes "pods" {
        role = "pod"
      }

      // 2. Scrape the discovered pods
      prometheus.scrape "pods" {
        targets    = discovery.kubernetes.pods.targets
        forward_to = [prometheus.remote_write.prom.receiver]
      }

      // 3. Remote write to your Prometheus service
      prometheus.remote_write "prom" {
        endpoint {
          url = "http://promstack-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090/api/v1/write"
        }
      }

      // --- Your Log Pipeline (Corrected) ---
      discovery.relabel "pods" {
        targets = discovery.kubernetes.pods.targets

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app", "__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          separator     = ";"
          regex         = "^;*([^;]+).*$"
          replacement   = "$1"
          target_label  = "app"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_node_name"]
          target_label  = "node"
        }
      }

      loki.source.kubernetes "pods" {
        targets    = discovery.relabel.pods.output
        forward_to = [loki.write.endpoint.receiver]
      }

      loki.relabel "journal" {
        forward_to = []

        rule {
          source_labels = ["__journal_priority", "__journal__comm"]
          separator     = ";"
          regex         = "^([0-4];.*|[5-7];(sshd|sudo|su|login))$"
          action        = "keep"
        }
        rule {
          source_labels = ["__journal__hostname"]
          target_label  = "node"
        }
        rule {
          source_labels = ["__journal__systemd_unit"]
          target_label  = "unit"
        }
        rule {
          source_labels = ["__journal__comm"]
          target_label  = "comm"
        }
        rule {
          source_labels = ["__journal_priority"]
          target_label  = "priority"
        }
      }

      loki.source.journal "host" {
        path          = "/var/log/journal"
        max_age       = "24h"
        relabel_rules = loki.relabel.journal.rules
        labels        = {
          job = "systemd-journal",
        }
        forward_to    = [loki.write.endpoint.receiver]
      }

      loki.write "endpoint" {
        endpoint {
          url = "http://my-loki.monitoring.svc.cluster.local:3100/loki/api/v1/push"
        }       
      }
