defaultRules:
  create: true
alertmanager:
  enabled: false
prometheusOperator:
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: DoesNotExist
kube-state-metrics:
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: DoesNotExist
grafana:
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: DoesNotExist
  persistence:
    enabled: true
    size: 5Gi
  grafana.ini:
    server:
      root_url: "https://grafana.example.com/"
      serve_from_sub_path: true
  # This is the correct way to inject Ingress via the Helm chart
  ingress:
    enabled: true
    ingressClassName: traefik
    hosts:
      - grafana.example.com
    annotations:
      # 🎯 FORCE GRAFANA TO HTTPS ENTRYPOINT
      traefik.ingress.kubernetes.io/router.entrypoints: "web, websecure"
    path: /
    pathType: Prefix
  additionalDataSources:
    - name: Loki
      type: loki
      access: proxy
      url: http://my-loki-gateway.monitoring.svc.cluster.local
      jsonData:
        maxLines: 1000
prometheus:
  prometheusSpec:
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: node-role.kubernetes.io/control-plane
                  operator: DoesNotExist
    resources:
      limits:
        memory: "1Gi"
        cpu: "500m"
      requests:
        memory: "512Mi"
        cpu: "250m"
