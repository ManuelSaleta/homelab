- Management:
    - Proxmox:
        icon: proxmox
        href: "{{HOMEPAGE_VAR_PROXMOX_URL}}"
        description: Proxmox Virtual Environment
        widget:
          type: proxmox
          url: "{{HOMEPAGE_VAR_PROXMOX_URL}}"
          username: "{{HOMEPAGE_VAR_PROXMOX_WIDGET_USER}}"
          password: "{{HOMEPAGE_VAR_PROXMOX_WIDGET_PASSWORD}}"
          node: "{{HOMEPAGE_VAR_PROXMOX_NODE_NAME}}"
          show:
            - vms
- Infrastructure:
    - Cloudflare-Pod:
        icon: cloudflare.png
        href: https://one.dash.cloudflare.com/
        description: Cloudflare Tunnel Daemon
        widget:
          type: kubernetes
          namespace: networking
          podSelector: app=cloudflared
- Network:
    - Cloudflare-Tunnel:
        icon: cloudflare.png
        href: https://one.dash.cloudflare.com/
        widget:
          type: cloudflared
          accountid: "{{HOMEPAGE_VAR_CF_ACCOUNT_ID}}"
          tunnelid: "{{HOMEPAGE_VAR_CF_TUNNEL_ID}}"
          key: "{{HOMEPAGE_VAR_CF_API_TOKEN}}"
          fields:
            - status
            - origin_ip
    - micro-nas:
        icon: tailscale.png
        href: https://login.tailscale.com/admin/machines
        widget:
          type: tailscale
          deviceid: "{{HOMEPAGE_VAR_TAILSCALE_NAS_DEVICE_ID}}"
          key: "{{HOMEPAGE_VAR_TAILSCALE_API_KEY}}"
          label: "NAS Status"
          fields: [address, last_seen]
    - macbook-pro:
        icon: tailscale.png
        href: https://login.tailscale.com/admin/machines
        widget:
          type: tailscale
          deviceid: "{{HOMEPAGE_VAR_TAILSCALE_LAPTOP_DEVICE_ID}}"
          key: "{{HOMEPAGE_VAR_TAILSCALE_API_KEY}}"
          label: "Laptop Status"
          fields: [address, last_seen]
- Web:
    - Manuel Saleta:
        icon: globe.png
        href: https://manuelsaleta.com
        description: Personal Portfolio & Website
    - GitHub:
        icon: github.png
        href: https://github.com/ManuelSaleta
        description: Manuel Saleta on GitHub
