apiVersion: v1
kind: Namespace
metadata:
  name: media
---
# 1. Music Library Persistent Volume & Claim
apiVersion: v1
kind: PersistentVolume
metadata:
  name: navidrome-music-pv
spec:
  capacity:
    storage: 200Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  nfs:
    server: 192.168.50.250
    path: /mnt/export/storage/navidrome/music
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: navidrome-music-pvc
  namespace: media
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  resources:
    requests:
      storage: 200Gi
  volumeName: navidrome-music-pv
---
# 2. Navidrome Database & State Persistent Volume & Claim
apiVersion: v1
kind: PersistentVolume
metadata:
  name: navidrome-config-pv
spec:
  capacity:
    storage: 5Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  nfs:
    server: 192.168.50.250
    path: /mnt/export/storage/navidrome/data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: navidrome-config-pvc
  namespace: media
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  resources:
    requests:
      storage: 5Gi
  volumeName: navidrome-config-pv
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: navidrome-media-server
  namespace: media
  labels:
    app: navidrome-media-server
    app.kubernetes.io/name: navidrome
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: navidrome-media-server
  template:
    metadata:
      labels:
        app: navidrome-media-server
    spec:
      containers:
        - name: navidrome-core-engine
          image: deluan/navidrome:latest
          env:
            - name: TZ
              value: "America/New_York"
            - name: ND_MUSICFOLDER
              value: "/music"
            - name: ND_DATAFOLDER
              value: "/data"
            - name: ND_SCANSCHEDULE
              value: "@every 30m"
            - name: ND_LOGLEVEL
              value: "info"
            - name: ND_ENABLETRANSCODINGCONFIG
              value: "true"
          ports:
            - containerPort: 4533
              name: admin-http
              protocol: TCP
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
          volumeMounts:
            - name: navidrome-music-mount
              mountPath: /music
              readOnly: true
            - name: navidrome-persistent-config
              mountPath: /data
      volumes:
        - name: navidrome-music-mount
          persistentVolumeClaim:
            claimName: navidrome-music-pvc
        - name: navidrome-persistent-config
          persistentVolumeClaim:
            claimName: navidrome-config-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: navidrome-service
  namespace: media
spec:
  type: ClusterIP
  selector:
    app: navidrome-media-server
  ports:
    - port: 4533
      targetPort: 4533
      protocol: TCP
      name: web
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: navidrome-ingress
  namespace: media
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Navidrome"
    gethomepage.dev/group: "Media"
    gethomepage.dev/icon: "navidrome"
    gethomepage.dev/href: "https://music.${DOMAIN_NAME}/"
    gethomepage.dev/pod-selector: "app=navidrome-media-server"
    traefik.ingress.kubernetes.io/router.entrypoints: web, websecure
spec:
  ingressClassName: traefik
  rules:
    - host: music.${DOMAIN_NAME}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: navidrome-service
                port:
                  number: 4533
